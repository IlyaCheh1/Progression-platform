    - paymentInstrument
    - payrollDetails
    - accessCodes
    - crmFreeText
    - guardianContactDetails

operations:
  availabilityTarget: "99.5%"
  bookingApiP95TargetMs: 300
  outboxLagAlertSeconds: 60
  backupRetentionDays: 30
  supportOwner: school-operations
  reconciliation:
    - attendance-to-reward
    - payment-to-fiscal-receipt
    - training-record-to-mastery
    - reward-to-owner-fulfillment
