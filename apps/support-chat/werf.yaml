---
project: chat-backend
configVersion: 1

{{ $GOLANG := "golang:1.25.0@sha256:91e2cd436f7adbfad0a0cbb7bf8502fa863ed8461414ceebe36c6304731e0fd9" }}
{{ $ALPINE := "alpine:3.22@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1" }}

---
image: builder
from: {{ $GOLANG }}
git:
- add: /
  to: /app
  excludePaths:
    - .helm
    - werf*
    - .git*
    - docker*
    - Docker*
    - configs
  stageDependencies:
    install:
      - go.sum
      - go.mod
    setup:
      - '**/*.go'
shell:
  install:
    - cd /app && go mod download
  setup:
    - cd /app
    - env CGO_ENABLED=0 GOOS=linux go build -a -o main ./cmd/chat
    - env CGO_ENABLED=0 GOOS=linux go build -a -o migrate ./cmd/migrate

---
image: app
fromImage: builder
import:
- image: builder
  add: /app/main
  to: /app/main
  before: install
shell:
  beforeInstall:
    - adduser -D -u 1001 -h /app -s /bin/bash app

---
image: migration
fromImage: builder
import:
- image: builder
  add: /app/migrate
  to: /app/migrate
  before: install
shell:
  beforeInstall:
    - adduser -D -u 1001 -h /app -s /bin/bash app

---
image: pg_client
from: {{ $ALPINE }}
shell:
  install:
    - apk add --update --no-cache postgresql-client
