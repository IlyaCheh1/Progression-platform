{{ $dbHost := pluck .Values.werf.env .Values.env.db.OGC_POSTGRESQL__DB_HOST | first | default .Values.env.db.OGC_POSTGRESQL__DB_HOST._default }}
{{ $dbPort := pluck .Values.werf.env .Values.env.db.OGC_POSTGRESQL__DB_PORT | first | default .Values.env.db.OGC_POSTGRESQL__DB_PORT._default }}
{{ $database := pluck .Values.werf.env .Values.env.db.OGC_POSTGRESQL__DB_NAME | first | default .Values.env.db.OGC_POSTGRESQL__DB_NAME._default }}
{{ $dbUsername := pluck .Values.werf.env .Values.env.db.OGC_POSTGRESQL__USERNAME | first | default .Values.env.db.OGC_POSTGRESQL__USERNAME._default }}
{{ $dbPassword :=  pluck .Values.werf.env .Values.env.db.OGC_POSTGRESQL__PASSWORD | first | default .Values.env.db.OGC_POSTGRESQL__PASSWORD._default }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-pg-init-check
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
type: Opaque
data:
  PG_HOST: {{ $dbHost | b64enc | quote }}
  PG_PORT: {{ $dbPort | b64enc | quote }}
  PG_DB: {{ $database | b64enc | quote }}
  PG_USER: {{ $dbUsername | b64enc | quote }}
  PGPASSWORD: {{ $dbPassword | b64enc | quote }}
